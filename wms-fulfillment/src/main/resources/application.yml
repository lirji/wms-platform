spring:
  application:
    name: wms-fulfillment
server:
  address: ${WMS_BIND_ADDRESS:127.0.0.1}
  port: ${WMS_HTTP_PORT:18185}
  max-http-request-header-size: 64KB
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.95,0.99
  endpoint:
    health:
      show-details: never
      group:
        readiness:
          include: readinessState,wmsReadiness
        liveness:
          include: livenessState
      probes:
        enabled: true
wms:
  # 内部机器协议独立发行方和主体白名单；中央模式未配置时拒绝全部内部请求。
  internal-oidc:
    issuer: ${WMS_INTERNAL_OIDC_ISSUER:}
    client-id: ${WMS_INTERNAL_OIDC_CLIENT_ID:}
    jwk-set-uri: ${WMS_INTERNAL_OIDC_JWK_SET_URI:}
    allowed-subjects: ${WMS_INTERNAL_OIDC_ALLOWED_SUBJECTS:}
  iam:
    enabled: ${WMS_IAM_ENABLED:false}
    configuration: ${WMS_IAM_CONFIGURATION:}
  transfer:
    serial:
      enabled: ${WMS_SERIAL_TRANSFER_ENABLED:false}
  oidc:
    issuer: ${WMS_OIDC_ISSUER:}
    jwk-set-uri: ${WMS_OIDC_JWK_SET_URI:}
    client-id: ${WMS_OIDC_CLIENT_ID:}
  tc:
    audit:
      enabled: ${WMS_TC_AUDIT_ENABLED:false}
      cluster-id: ${WMS_TC_CLUSTER_ID:}
      transaction-group: ${WMS_TC_TRANSACTION_GROUP:}
      jdbc-url: ${WMS_TC_AUDIT_JDBC_URL:}
      username: ${WMS_TC_AUDIT_USER:}
      password: ${WMS_TC_AUDIT_PASSWORD:}
  fulfillment:
    datasource:
      url: ${WMS_FULFILLMENT_JDBC_URL:}
      username: ${WMS_FULFILLMENT_DB_USER:}
      password: ${WMS_FULFILLMENT_DB_PASSWORD:}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"

# 本项目只使用固定双身份中央客户端，不启动SDK旧远程策略引擎。
authz:
  client:
    enabled: false
