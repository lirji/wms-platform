components:
  securitySchemes:
    oidc:
      type: openIdConnect
      description: issuer 与 client 由 WMS_OIDC_ISSUER / WMS_OIDC_CLIENT_ID 指向已有提供方，仓库不写死密钥
      openIdConnectUrl: https://issuer.example.invalid/.well-known/openid-configuration
  parameters:
    SerialEnterpriseHeader:
      name: X-Wms-Enterprise-Id
      in: header
      required: true
      description: 调用方预期企业，必须与签名JWT企业相同，避免误用另一租户服务令牌
      schema: { $ref: '#/components/schemas/Id' }
    SerialSkuQuery:
      name: skuId
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    SerialQuery:
      name: serial
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    MessageQueue:
      name: queue
      in: path
      required: true
      schema: { type: string, enum: [INBOX, OUTBOX] }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    MessageState:
      name: status
      in: query
      schema: { type: string, enum: [PENDING, CLAIMED, ISOLATED], default: ISOLATED }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
      description: 与 clientOperationId 一致；同键同内容返回原结果，同键异内容 409
    XRequestId:
      name: X-Request-Id
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema: { type: string }
    Cursor:
      description: 不透明游标，绑定原查询条件；更换筛选或投影世代后从第一页重新读取。
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    WarehouseId:
      name: warehouseId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    FulfillmentId:
      name: fulfillmentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    InboundOrderId:
      name: inboundOrderId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    OutboundOrderId:
      name: outboundOrderId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    InspectionId:
      name: inspectionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    HoldId:
      name: holdId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    TransferId:
      name: transferId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    CountPlanId:
      name: countPlanId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    AdjustmentId:
      name: adjustmentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    BalanceId:
      name: balanceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    OperationId:
      name: operationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    AfterPart:
      name: afterPart
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    EffectId:
      name: effectId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    LocationId:
      name: locationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    SkuId:
      name: skuId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    LotId:
      name: lotId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    CommandId:
      name: commandId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    PermitId:
      name: permitId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    TaskType:
      name: taskType
      in: query
      required: true
      schema: { type: string }
    SkuIdQuery:
      name: skuId
      in: query
      required: false
      schema: { $ref: '#/components/schemas/Id' }
    LotIdQuery:
      name: lotId
      in: query
      required: false
      schema: { $ref: '#/components/schemas/Id' }
    QualityCodeQuery:
      name: qualityCode
      in: query
      required: false
      schema: { type: string }
    WarehouseIdsQuery:
      description: 当前单次查询只支持一个仓库；跨仓分别读取并保留各仓水位。
