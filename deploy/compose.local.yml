# WMS 隔离本地中间件。不加入 sibling `/Users/liruijun/personal/LLM/dev-infra` 网络，
# 不 depends_on 共享容器，不修改该仓库。ordinary 共享 MySQL/Redis/Kafka/MinIO 仍在
# dev-infra（mysql:8.4 宿主 43306、redis:7-alpine 46379、apache/kafka:3.8.0 49092）。
# Seata 不在 dev-infra；XXL 不共用 drools-demo 的 18088 / mysql 3307。
# 本文件只起中间件，不启动 inbound/outbound/inventory JAR。inventory 仅在显式 WMS_INVENTORY_JDBC_URL 时接库；smoke 不设该变量。
# 默认宿主端口避开本机 Apollo MySQL 13306、dev-infra 与 drools XXL 18088。
# 故障注入另起项目名、端口与网段，例如 COMPOSE_PROJECT_NAME=wms-fault
# 与 WMS_COMPOSE_SUBNET=10.89.41.0/24 加独立 .env；禁止 docker kill / compose down 共享 dev-infra。
name: wms-local

x-mysql-health: &mysql-health
  test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 25s

services:
  mysql-apps:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${WMS_MYSQL_APPS_ROOT_PASSWORD:?set WMS_MYSQL_APPS_ROOT_PASSWORD}
      WMS_INBOUND_DB_PASSWORD: ${WMS_INBOUND_DB_PASSWORD:?set WMS_INBOUND_DB_PASSWORD}
      WMS_OUTBOUND_DB_PASSWORD: ${WMS_OUTBOUND_DB_PASSWORD:?set WMS_OUTBOUND_DB_PASSWORD}
      WMS_FULFILLMENT_DB_PASSWORD: ${WMS_FULFILLMENT_DB_PASSWORD:?set WMS_FULFILLMENT_DB_PASSWORD}
      WMS_SERIAL_DB_PASSWORD: ${WMS_SERIAL_DB_PASSWORD:?set WMS_SERIAL_DB_PASSWORD}
      WMS_SEATA_DB_PASSWORD: ${WMS_SEATA_DB_PASSWORD:?set WMS_SEATA_DB_PASSWORD}
      WMS_XXL_DB_PASSWORD: ${WMS_XXL_DB_PASSWORD:?set WMS_XXL_DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${WMS_BIND_ADDRESS:-127.0.0.1}:${WMS_MYSQL_APPS_HOST_PORT:-18306}:3306"
    volumes:
      - mysql-apps-data:/var/lib/mysql
      - ./init/mysql-apps:/docker-entrypoint-initdb.d:ro
    healthcheck: *mysql-health
    mem_limit: ${WMS_MYSQL_APPS_MEMORY_LIMIT:-1g}
    networks: [wms-local]

  mysql-cell-a:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${WMS_MYSQL_CELL_A_ROOT_PASSWORD:?set WMS_MYSQL_CELL_A_ROOT_PASSWORD}
      WMS_INVENTORY_A_DB_PASSWORD: ${WMS_INVENTORY_A_DB_PASSWORD:?set WMS_INVENTORY_A_DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${WMS_BIND_ADDRESS:-127.0.0.1}:${WMS_MYSQL_CELL_A_HOST_PORT:-18307}:3306"
    volumes:
      - mysql-cell-a-data:/var/lib/mysql
      - ./init/mysql-cell-a:/docker-entrypoint-initdb.d:ro
    healthcheck: *mysql-health
    mem_limit: ${WMS_MYSQL_CELL_MEMORY_LIMIT:-768m}
    networks: [wms-local]

  mysql-cell-b:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${WMS_MYSQL_CELL_B_ROOT_PASSWORD:?set WMS_MYSQL_CELL_B_ROOT_PASSWORD}
      WMS_INVENTORY_B_DB_PASSWORD: ${WMS_INVENTORY_B_DB_PASSWORD:?set WMS_INVENTORY_B_DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${WMS_BIND_ADDRESS:-127.0.0.1}:${WMS_MYSQL_CELL_B_HOST_PORT:-18308}:3306"
    volumes:
      - mysql-cell-b-data:/var/lib/mysql
      - ./init/mysql-cell-b:/docker-entrypoint-initdb.d:ro
    healthcheck: *mysql-health
    mem_limit: ${WMS_MYSQL_CELL_MEMORY_LIMIT:-768m}
    networks: [wms-local]

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://${WMS_KAFKA_ADVERTISED_HOST:-localhost}:${WMS_KAFKA_HOST_PORT:-18992}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: ${WMS_KAFKA_HEAP_OPTS:--Xms256m -Xmx256m}
    ports:
      - "${WMS_BIND_ADDRESS:-127.0.0.1}:${WMS_KAFKA_HOST_PORT:-18992}:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms16m -Xmx64m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 20s
      retries: 30
      start_period: 25s
    mem_limit: ${WMS_KAFKA_MEMORY_LIMIT:-768m}
    networks: [wms-local]

  kafka-init:
    image: apache/kafka:3.8.0
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: -Xms16m -Xmx64m
      WMS_TOPIC_PREFIX: ${WMS_MESSAGING_TOPIC_PREFIX:-wms.local}
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        bootstrap=kafka:9092
        for topic in wms.local.inbound.outbox wms.local.outbound.outbox wms.local.inventory.outbox; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$bootstrap" --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done
        for suffix in inventory.events inbound.commands inbound.results; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$bootstrap" --create --if-not-exists --topic "$${WMS_TOPIC_PREFIX}.$$suffix" --partitions 1 --replication-factor 1 --config retention.ms=604800000 --config retention.bytes=268435456
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$bootstrap" --list
    networks: [wms-local]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${WMS_REDIS_PASSWORD:?set WMS_REDIS_PASSWORD}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
    environment:
      REDIS_PASSWORD: ${WMS_REDIS_PASSWORD:?set WMS_REDIS_PASSWORD}
    ports:
      - "${WMS_BIND_ADDRESS:-127.0.0.1}:${WMS_REDIS_HOST_PORT:-18379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: ${WMS_REDIS_MEMORY_LIMIT:-256m}
    networks: [wms-local]

  seata-server:
    image: apache/seata-server:2.6.0
    restart: unless-stopped
    depends_on:
      mysql-apps:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      STORE_MODE: db
      SEATA_IP: ${WMS_SEATA_ADVERTISED_IP:-127.0.0.1}
      SEATA_PORT: "8091"
      JAVA_OPTS: ${WMS_SEATA_JAVA_OPTS:--Xms128m -Xmx256m}
      SEATA_STORE_DB_DATASOURCE: druid
      SEATA_STORE_DB_DB_TYPE: mysql
      SEATA_STORE_DB_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SEATA_STORE_DB_URL: jdbc:mysql://mysql-apps:3306/seata?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SEATA_STORE_DB_USER: wms_seata
      SEATA_STORE_DB_PASSWORD: ${WMS_SEATA_DB_PASSWORD:?set WMS_SEATA_DB_PASSWORD}
    ports:
      - "${WMS_BIND_ADDRESS:-127.0.0.1}:${WMS_SEATA_HOST_PORT:-18091}:8091"
      - "${WMS_BIND_ADDRESS:-127.0.0.1}:${WMS_SEATA_CONSOLE_HOST_PORT:-17091}:7091"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8091'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: ${WMS_SEATA_MEMORY_LIMIT:-512m}
    networks: [wms-local]

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.2
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      mysql-apps:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql-apps:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
        --spring.datasource.username=wms_xxl
        --spring.datasource.password=${WMS_XXL_DB_PASSWORD:?set WMS_XXL_DB_PASSWORD}
        --xxl.job.accessToken=${WMS_XXL_ACCESS_TOKEN:?set WMS_XXL_ACCESS_TOKEN}
        --xxl.job.logretentiondays=7
    ports:
      - "${WMS_BIND_ADDRESS:-127.0.0.1}:${WMS_XXL_ADMIN_HOST_PORT:-18080}:8080"
    volumes:
      - xxl-admin-logs:/data/applogs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    mem_limit: ${WMS_XXL_MEMORY_LIMIT:-512m}
    networks: [wms-local]

networks:
  wms-local:
    driver: bridge
    ipam:
      config:
        - subnet: ${WMS_COMPOSE_SUBNET:-10.89.40.0/24}

volumes:
  mysql-apps-data:
  mysql-cell-a-data:
  mysql-cell-b-data:
  kafka-data:
  redis-data:
  xxl-admin-logs:
