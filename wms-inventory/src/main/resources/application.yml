spring:
  application:
    name: wms-inventory
server:
  address: ${WMS_BIND_ADDRESS:127.0.0.1}
  port: ${WMS_HTTP_PORT:18183}
  max-http-request-header-size: 64KB
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.95,0.99
  endpoint:
    health:
      show-details: never
      group:
        readiness:
          include: readinessState,wmsReadiness
        liveness:
          include: livenessState
      probes:
        enabled: true
seata:
  enabled: true
  enable-auto-data-source-proxy: false
  application-id: ${spring.application.name}
  tx-service-group: wms_inventory_group
wms:
  oidc:
    issuer: ${WMS_OIDC_ISSUER:}
    jwk-set-uri: ${WMS_OIDC_JWK_SET_URI:}
    client-id: ${WMS_OIDC_CLIENT_ID:}
  inventory:
    datasource:
      url: ${WMS_INVENTORY_JDBC_URL:}
      username: ${WMS_INVENTORY_DB_USER:}
      password: ${WMS_INVENTORY_DB_PASSWORD:}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
