spring:
  application:
    name: wms-outbound
server:
  address: ${WMS_BIND_ADDRESS:127.0.0.1}
  port: ${WMS_HTTP_PORT:18182}
  max-http-request-header-size: 64KB
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.95,0.99
  endpoint:
    health:
      show-details: never
      group:
        readiness:
          include: readinessState,wmsReadiness
        liveness:
          include: livenessState
      probes:
        enabled: true
wms:
  oidc:
    issuer: ${WMS_OIDC_ISSUER:}
    jwk-set-uri: ${WMS_OIDC_JWK_SET_URI:}
    client-id: ${WMS_OIDC_CLIENT_ID:}
  outbound:
    datasource:
      url: ${WMS_OUTBOUND_JDBC_URL:}
      username: ${WMS_OUTBOUND_DB_USER:}
      password: ${WMS_OUTBOUND_DB_PASSWORD:}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
